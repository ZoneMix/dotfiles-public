# Terminal settings
set -g default-terminal "tmux-256color"  # Supports 256 colors
set -g allow-passthrough on  # Allows escape sequences to pass through
#set -g set-clipboard external  # Enables OSC 52 for external clipboard
set -g set-clipboard on
#set -as terminal-overrides ',screen*:Ms=\\E]52;%p1%s;%p2%s\\007'  # OSC 52 support
set -as terminal-overrides ',*:Ms=\\E]52;%p1%s;%p2%s\\007'
set -g window-size largest

# Keybindings
unbind-key C-b
unbind-key "\""
unbind-key C-s

# ── Perfect nested prefix passthrough (no F12 needed) ─────────────
set-option -g prefix C-s                  # your normal outer prefix
bind-key C-s send-prefix                  # first C-s = outer command

# Window configurations
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
bind Space last-window
bind c new-window -c "#{pane_current_path}"
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D
set-option -g allow-rename off
bind-key -r Tab select-pane -t :.+

# Status and behavior
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none
set -g status-position bottom
set -sg escape-time 0
set -g history-limit 5000
set -g status-keys vi
setw -g mode-keys vi
set -g mouse on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'  # Comment if not using session capture
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'  # Comment if not using
set -g @resurrect-save 'S'  # Bind prefix + S to save (e.g., Ctrl-s S)
set -g @resurrect-restore 'R'  # Bind prefix + R to restore

# Copy mode bindings
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'  # Local mouse copy (falls back to OSC 52)
bind b copy-mode
bind C-p choose-buffer
bind -n M-Up copy-mode

# Load theme and plugins
source ~/.tmuxline.conf
run '~/.tmux/plugins/tpm/tpm'

# 2026-10-20 color fix (Terminal Boss): truecolor for kitty, never inherit bot no-color env
set -ga terminal-features "xterm-kitty:RGB"
set-environment -gu NO_COLOR
set-environment -gu FORCE_COLOR
